# Configuration de l'item Ancre de Téléportation
anchor:
  name: "&5Ancre de Téléportation"
  lore:
    - "&7Placez cette ancre et liez-la"
    - "&7à une autre pour créer un"
    - "&7point de &5téléportation&7."
    - ""
    - "&7&o(( &5Accroupissez-vous sur l'ancre"
    - "&5pour vous &5téléporter ! &7&o))"

