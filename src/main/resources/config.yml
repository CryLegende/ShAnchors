# Configuration du menu (GUI)
gui:
  title: "&8Gestion de l'ancre"
  filler-item:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
  linked-anchor-item:
    material: "ENDER_EYE"
    name: "&eAncre Liée"
    lore:
      - ""
      - "&8&l« &7Cette ancre est liée à une"
      - "&7autre ancre. Accroupissez-vous"
      - "&7sur l'ancre pour vous &5téléporter &8&l»"
      - ""
      - "&fCoordonnées: &e%x%x %y%y %z%z"
      - ""
  link-item:
    material: "ENDER_PEARL"
    name: "&5Lier cette ancre"
    lore:
      - ""
      - "&8&l« &7Liez cette ancre à une autre"
      - "&7pour créer un point de &5téléportation &8&l»"
      - ""
      - "&7&o(( &5&oCliquez pour démarrer la liaison &7&o))"
  unlink-item:
    material: "BARRIER"
    name: "&cSupprimer la liaison"
    lore:
      - ""
      - "&7&o(( &c&oCliquez pour supprimer la liaison &7&o))"
  access-public-item:
    material: "PLAYER_HEAD"
    name: "&aRendre Publique"
    lore:
      - ""
      - "&8&l« &7Autoriser tous les joueurs"
      - "&7à utiliser cette ancre &8&l»"
      - ""
      - "&fStatut actuel: &cMembres de l'île"
      - ""
      - "&7&o(( &a&oCliquez pour changer &7&o))"
  access-island-item:
    material: "IRON_DOOR"
    name: "&cRestreindre aux Membres"
    lore:
      - ""
      - "&8&l« &7Autoriser uniquement les membres"
      - "&7de votre île à utiliser cette ancre &8&l»"
      - ""
      - "&fStatut actuel: &aPublique"
      - ""
      - "&7&o(( &c&oCliquez pour changer &7&o))"
  orientation-item:
    material: "COMPASS"
    name: "&eOrientation de téléportation"
    lore:
      - ""
      - "&8&l« &7Changer la direction dans"
      - "&7laquelle le joueur regardera en"
      - "&7se téléportant à cette ancre &8&l»"
      - ""
      - "&fOrientation: &e%orientation%"
      - ""
      - "&7&o(( &e&oCliquez pour changer &7&o))"
    states:
      DEFAULT: "Défaut (Direction du joueur)"
      NORTH: "Nord"
      SOUTH: "Sud"
      EAST: "Est"
      WEST: "Ouest"
  slots:
    linked: 13
    link: 13
    access: 11
    orientation: 15

# Options de téléportation
teleport:
  delay-ms: 500

# Sons du plugin
sounds:
  link-performed:
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2
  link-expired:
    sound: "ENTITY_ITEM_BREAK"
    volume: 1.0
    pitch: 1.0
  link-deleted:
    sound: "BLOCK_ANVIL_LAND"
    volume: 1.0
    pitch: 0.8
  toggle-access:
    sound: "UI_BUTTON_CLICK"
    volume: 0.8
    pitch: 1.5