name: ShAnchors
version: '${project.version}'
main: org.Cry_Legende.sHAnchors.SHAnchors
api-version: '1.20'
author: Cry_Legende
softdepend: [SuperiorSkyblock2]

commands:
  shanchors:
    description: Commandes du plugin SHAnchors
    usage: /shanchors give <joueur> [quantité]
    permission: shanchors.give

permissions:
  shanchors.give:
    description: Permet de donner des ancres de téléportation
    default: op
  shanchors.bypass:
    description: Permet dy bypass la protection d'île
    default: op
